services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        PUBLIC_NEWSLETTER_ENABLED: ${PUBLIC_NEWSLETTER_ENABLED:-false}
        PUBLIC_INQUIRY_ENABLED: ${PUBLIC_INQUIRY_ENABLED:-false}
        PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY:-}
    depends_on:
      - inquiry
      - preview
    restart: unless-stopped
    # No `ports`: Dokploy's Traefik owns host 80/443. It reaches the container
    # over dokploy-network; routing is declared via the labels below.
    expose:
      - "80"
    networks:
      - dokploy-network
      - inquiry-private
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS router (primary)
      - "traefik.http.routers.cl-website-websecure.rule=Host(`wearecodelovers.com`) || Host(`www.wearecodelovers.com`)"
      - traefik.http.routers.cl-website-websecure.entrypoints=websecure
      - traefik.http.routers.cl-website-websecure.tls=true
      - traefik.http.routers.cl-website-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.cl-website-websecure.service=cl-website
      - traefik.http.services.cl-website.loadbalancer.server.port=80
      # HTTP router: redirect everything to HTTPS
      - "traefik.http.routers.cl-website-web.rule=Host(`wearecodelovers.com`) || Host(`www.wearecodelovers.com`)"
      - traefik.http.routers.cl-website-web.entrypoints=web
      - traefik.http.routers.cl-website-web.middlewares=cl-website-redirect
      - traefik.http.routers.cl-website-web.service=cl-website
      - traefik.http.middlewares.cl-website-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.cl-website-redirect.redirectscheme.permanent=true

  preview:
    build:
      context: .
      dockerfile: Dockerfile
      target: preview
      args:
        PUBLIC_NEWSLETTER_ENABLED: ${PUBLIC_NEWSLETTER_ENABLED:-false}
        PUBLIC_INQUIRY_ENABLED: ${PUBLIC_INQUIRY_ENABLED:-false}
        PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY:-}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      STAKEHOLDER_REVIEW_DIR: /var/lib/codelovers-reviews
      STAKEHOLDER_RESPONSE_DIR: /var/lib/codelovers-responses
    volumes:
      - stakeholder-reviews:/var/lib/codelovers-reviews:ro
      - stakeholder-responses:/var/lib/codelovers-responses
    networks:
      - inquiry-private

  inquiry:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NEWSLETTER_ENABLED: ${NEWSLETTER_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_NEWSLETTER_LIST_EN: ${BREVO_NEWSLETTER_LIST_EN:-}
      BREVO_NEWSLETTER_LIST_FR: ${BREVO_NEWSLETTER_LIST_FR:-}
      BREVO_DOI_TEMPLATE_EN: ${BREVO_DOI_TEMPLATE_EN:-}
      BREVO_DOI_TEMPLATE_FR: ${BREVO_DOI_TEMPLATE_FR:-}
      ERP_URL: ${ERP_URL:-https://erp.boutchaz.dev}
      ERP_INTAKE_API_KEY: ${ERP_INTAKE_API_KEY:-}
      ERP_INTAKE_API_SECRET: ${ERP_INTAKE_API_SECRET:-}
      CAL_WEBHOOK_SECRET: ${CAL_WEBHOOK_SECRET:-}
    networks:
      - inquiry-private
  # The intake service has no public port or Traefik route.

networks:
  inquiry-private:
  dokploy-network:
    external: true

volumes:
  stakeholder-reviews:
  stakeholder-responses:
