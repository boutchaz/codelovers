server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (document responses; Lighthouse / browser policy)
    # HSTS only meaningful behind TLS terminator — still safe to send on :80 when TLS is terminated upstream.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Long-lived caching for hashed static assets
    # Note: add_header in a location replaces server-level add_header inheritance — repeat security headers.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Long-lived caching for static images/fonts served from public/ (frames, logo, favicon)
    location ~* \.(?:png|jpg|jpeg|webp|avif|gif|svg|ico|woff2?|mp4)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Security: never cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # PostHog reverse proxy (mirrors the previous Next.js rewrites)
    # Required to support PostHog trailing slash API requests
    location = /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ingest/static/ {
        proxy_pass https://eu-assets.i.posthog.com/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Legacy URL redirects (most specific first)
    location = /case-studies/login-tel { return 301 https://$host/case-studies/logintel-saas/; }
    location = /case-studies/login-tel-saas { return 301 https://$host/case-studies/logintel-saas/; }
    location = /case-studies/logintel { return 301 https://$host/case-studies/logintel-saas/; }
    location = /case-studies/passionfitness { return 301 https://$host/case-studies/passion-fitness/; }
    location = /case-studies/whatsapp-bot { return 301 https://$host/case-studies/whatsapp-reservation-bot/; }
    location = /en { return 301 https://$host/; }
    location = /en/ { return 301 https://$host/; }
    location = /fr/about { return 301 https://$host/fr/; }
    location = /fr/about/ { return 301 https://$host/fr/; }
    location = /fr/case-studies { return 301 https://$host/fr/; }
    location = /fr/case-studies/ { return 301 https://$host/fr/; }

    # Sitemap redirect: /sitemap.xml -> /sitemap-index.xml
    location = /sitemap.xml { return 301 https://$host/sitemap-index.xml; }

    # Clean URLs with trailing slash enforcement
    location / {
        # Capture the forwarded protocol (from Dokploy TLS terminator) or default to https
        set $redirect_scheme https;
        if ($http_x_forwarded_proto != '') {
            set $redirect_scheme $http_x_forwarded_proto;
        }

        # If URI doesn't end with /, isn't a file, and isn't an extension-based request, redirect to trailing slash
        if (-f $request_filename) {
            break;
        }
        if ($uri !~ \.) {
            # Check if URI already has trailing slash
            set $test_slash "${uri}L";
            if ($test_slash !~ "/$") {
                return 301 $redirect_scheme://$host$uri/;
            }
        }

        # Serve files: try exact match, then .html, then directory index, then 404
        try_files $uri $uri.html $uri/ =404;
    }

    # 404 page
    error_page 404 /404.html;
}
