# Scheme for redirects: the TLS terminator's X-Forwarded-Proto, else https.
map $http_x_forwarded_proto $redirect_scheme {
    default $http_x_forwarded_proto;
    ""      https;
}

# Limits apply per visitor (see set_real_ip_from below) with a looser ceiling across all visitors, so one
# noisy client cannot lock everyone else out and a client that evades the per-visitor limit cannot flood ERP.
limit_req_zone $binary_remote_addr zone=preview:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=review:10m rate=10r/m;
limit_req_zone $server_name zone=review_all:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=inquiry:10m rate=10r/m;
limit_req_zone $server_name zone=inquiry_all:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=newsletter:10m rate=5r/m;
limit_req_zone $server_name zone=newsletter_all:1m rate=30r/m;
# Cal.com calls from a few addresses and is authenticated by signature, so only a global ceiling applies.
limit_req_zone $server_name zone=booking_all:1m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The only way to reach this container is through the Traefik proxy on the Docker network, which
    # appends the address it actually saw to X-Forwarded-For. Use that last entry as the client address,
    # never an earlier one a visitor could have forged. Only private (Docker) peers are trusted.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Security headers (document responses; Lighthouse / browser policy)
    # HSTS only meaningful behind TLS terminator — still safe to send on :80 when TLS is terminated upstream.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Astro's shared header requests these two logo sizes when rendered on demand.
    # No other image transforms are exposed through the preview service.
    location = /_image/ {
        if ($request_method != GET) { return 405; }
        if ($args !~ "^href=%2F_astro%2Flogo-mark[.][A-Za-z0-9_-]+[.]png&w=(48|96)&h=(48|96)&f=webp$") { return 404; }
        limit_req zone=preview burst=5 nodelay;
        resolver 127.0.0.11 valid=10s;
        set $preview_service preview:4321;
        proxy_pass http://$preview_service;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 10s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=86400";
    }

    # Drafts are POSTed by the ERP, never stored or exposed as a public article URL.
    location = /preview/blog/ {
        limit_req zone=preview burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;
        resolver 127.0.0.11 valid=10s;
        set $preview_service preview:4321;
        proxy_pass http://$preview_service;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Defining headers here deliberately replaces SAMEORIGIN; the route's CSP allows only ERP framing.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Code-gated stakeholder drafts. Content lives only in the renderer's private volume.
    location ^~ /review/ {
        limit_req zone=review burst=3 nodelay;
        limit_req zone=review_all burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        resolver 127.0.0.11 valid=10s;
        set $review_service preview:4321;
        proxy_pass http://$review_service;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 15s;
        proxy_next_upstream off;
        access_log off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Internal-only service. The ERP credential is never embedded in the static site.
    location = /api/inquiry {
        limit_req zone=inquiry burst=5 nodelay;
        limit_req zone=inquiry_all burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 24k;
        resolver 127.0.0.11 valid=10s;
        set $intake_service inquiry:8080;
        proxy_pass http://$intake_service/api/inquiry;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 25s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    location = /api/newsletter {
        limit_req zone=newsletter burst=3 nodelay;
        limit_req zone=newsletter_all burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        resolver 127.0.0.11 valid=10s;
        set $intake_service inquiry:8080;
        proxy_pass http://$intake_service/api/newsletter;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 25s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    # Signed Cal.com booking webhooks; the relay verifies the HMAC signature and fails closed without a secret.
    location = /api/cal-webhook {
        limit_req zone=booking_all burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        resolver 127.0.0.11 valid=10s;
        set $intake_service inquiry:8080;
        proxy_pass http://$intake_service/api/cal-webhook;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 25s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Long-lived caching for hashed static assets
    # Note: add_header in a location replaces server-level add_header inheritance — repeat security headers.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Long-lived caching for static media/fonts served from public/ (hero video, logo, favicon)
    location ~* \.(?:png|jpg|jpeg|webp|avif|gif|svg|ico|woff2?|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Security: never cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }

    # PostHog reverse proxy (mirrors the previous Next.js rewrites)
    # Required to support PostHog trailing slash API requests
    location = /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ingest/static/ {
        proxy_pass https://eu-assets.i.posthog.com/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Legacy URL redirects (most specific first)
    location = /case-studies/login-tel { return 301 https://$host/case-studies/logintel-saas/; }
    location = /case-studies/login-tel-saas { return 301 https://$host/case-studies/logintel-saas/; }
    location = /case-studies/logintel { return 301 https://$host/case-studies/logintel-saas/; }
    location = /case-studies/passionfitness { return 301 https://$host/case-studies/passion-fitness/; }
    location = /case-studies/whatsapp-bot { return 301 https://$host/case-studies/whatsapp-reservation-bot/; }
    location = /en { return 301 https://$host/; }
    location = /en/ { return 301 https://$host/; }
    location = /contact { return 301 https://$host/#contact; }
    location = /contact/ { return 301 https://$host/#contact; }
    location = /fr/blog { return 301 https://$host/blog/; }
    location = /fr/blog/ { return 301 https://$host/blog/; }
    location = /fr/contact { return 301 https://$host/fr/#contact; }
    location = /fr/contact/ { return 301 https://$host/fr/#contact; }

    # Sitemap redirect: /sitemap.xml -> /sitemap-index.xml
    location = /sitemap.xml { return 301 https://$host/sitemap-index.xml; }

    # Clean URLs with trailing slash enforcement.
    # nginx forbids nested `if`, so the check is a single regex; the scheme comes from a map (see top of file).
    location / {
        # No extension and no trailing slash -> redirect to the trailing-slash URL.
        if ($uri !~ "(\.|/$)") {
            return 301 $redirect_scheme://$host$uri/;
        }

        # Serve files: try exact match, then .html, then directory index, then 404
        try_files $uri $uri.html $uri/ =404;
    }

    # 404 page
    error_page 404 /404.html;
}
