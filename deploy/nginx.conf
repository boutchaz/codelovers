server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Long-lived caching for hashed static assets
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Security: never cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # PostHog reverse proxy (mirrors the previous Next.js rewrites)
    # Required to support PostHog trailing slash API requests
    location = /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ingest/static/ {
        proxy_pass https://eu-assets.i.posthog.com/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu-assets.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ingest/ {
        proxy_pass https://eu.i.posthog.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host eu.i.posthog.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Clean URLs: /about -> /about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 404 page
    error_page 404 /404.html;
}
